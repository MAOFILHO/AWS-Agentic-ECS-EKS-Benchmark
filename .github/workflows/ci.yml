name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked ruff check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked pytest

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: helm lint
        run: |
          helm lint infra/helm/workload -f infra/helm/workload/values-ec2.yaml
          helm lint infra/helm/workload -f infra/helm/workload/values-fargate.yaml
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked pytest tests/test_helm_chart.py

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t triage-workload workload/

  cfn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: cfn-lint
        run: uvx cfn-lint==1.57.2 infra/cfn/*.yaml
      - name: Install cfn-guard
        run: |
          # Installer pinned to the 3.1.2 tag commit; it installs cfn-guard 3.1.2. Bump both together.
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/aws-cloudformation/cloudformation-guard/de26750fa2d97099272156238041968abeb3b95b/install-guard.sh | sh -s -- -v 3.1.2
          echo "$HOME/.guard/bin" >> "$GITHUB_PATH"
      - name: cfn-guard validate
        run: cfn-guard validate --data infra/cfn --rules infra/cfn-guard/rules.guard
      - name: cfn-guard rejects a mutable ECR repository
        run: |
          if cfn-guard validate --data tests/cfn-guard/bad-mutable-ecr.yaml --rules infra/cfn-guard/rules.guard; then
            echo "expected cfn-guard to fail on the mutable ECR fixture"
            exit 1
          fi
      - name: cfn-guard accepts the fixed copy
        run: cfn-guard validate --data tests/cfn-guard/good-immutable-ecr.yaml --rules infra/cfn-guard/rules.guard
      - name: cfn-guard rejects a task security group open to the internet
        run: |
          if cfn-guard validate --data tests/cfn-guard/bad-open-task-sg.yaml --rules infra/cfn-guard/rules.guard; then
            echo "expected cfn-guard to fail on the open task security group fixture"
            exit 1
          fi
      - name: cfn-guard accepts the closed task security group
        run: cfn-guard validate --data tests/cfn-guard/good-closed-task-sg.yaml --rules infra/cfn-guard/rules.guard
