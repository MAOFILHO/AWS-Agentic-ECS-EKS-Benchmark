AWSTemplateFormatVersion: "2010-09-09"
Description: Bootstrap stack. Monthly budget alarm, the ECR repository for the workload image, and the GitHub OIDC deploy role.

Parameters:
  BudgetEmail:
    Type: String
    Description: Address that receives the budget alerts. Pass it at deploy time; never commit it.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Must be an email address.

Resources:
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: agentic-platform-advisor-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 15
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
      ResourceTags:
        - Key: project
          Value: agentic-platform-advisor

  WorkloadRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: triage-workload
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: project
          Value: agentic-platform-advisor

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: project
          Value: agentic-platform-advisor

  # CI assumes this role through OIDC. No access keys exist (ADR 0005).
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: agentic-platform-advisor-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only the main branch of this one repository.
                token.actions.githubusercontent.com:sub: repo:MAOFILHO/agentic-platform-advisor:ref:refs/heads/main
      Policies:
        - PolicyName: benchmark-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Deploy and delete the benchmark stacks (SPEC 9: 10-network to 41-eks-lbc-iam).
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ListStackResources
                  - cloudformation:ValidateTemplate
                  - cloudformation:TagResource
                  - cloudformation:UntagResource
                Resource: "*"
              # ECR login token; AWS does not scope it to a repository.
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              # Push the workload image to its one repository.
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt WorkloadRepository.Arn
              # 10-network VPC, subnets, gateways, security groups; EKS node instances.
              - Sid: Ec2
                Effect: Allow
                Action: ec2:*
                Resource: "*"
              # 20-harness and 30-ecs clusters, services, k6 RunTask.
              - Sid: Ecs
                Effect: Allow
                Action: ecs:*
                Resource: "*"
              # 30-ecs service scaling.
              - Sid: AppAutoScaling
                Effect: Allow
                Action: application-autoscaling:*
                Resource: "*"
              # 40-eks cluster, node groups, add-ons, Pod Identity associations.
              - Sid: Eks
                Effect: Allow
                Action: eks:*
                Resource: "*"
              # ALBs in 30-ecs and the ones the EKS load balancer controller creates.
              - Sid: LoadBalancing
                Effect: Allow
                Action: elasticloadbalancing:*
                Resource: "*"
              # Log groups in every stack.
              - Sid: Logs
                Effect: Allow
                Action: logs:*
                Resource: "*"
              # Collector reads latency and scale-out metrics.
              - Sid: MetricsRead
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                Resource: "*"
              # Kubernetes version and EKS AMI from SSM public parameters (SPEC 10).
              - Sid: SsmPublicParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/*
              # Teardown tag sweep finds leftover resources.
              - Sid: TagSweep
                Effect: Allow
                Action: tag:GetResources
                Resource: "*"
              # Cost model prices and next-day reconcile.
              - Sid: CostRead
                Effect: Allow
                Action:
                  - pricing:GetProducts
                  - ce:GetCostAndUsage
                Resource: "*"
              # Task, node and controller roles the stacks create.
              - Sid: IamStackRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/*
              # Service-linked roles ECS, EKS and ELB create on first use.
              - Sid: IamServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*
              # Hand stack roles only to the services that run the workload.
              - Sid: IamPassRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ecs-tasks.amazonaws.com
                      - eks.amazonaws.com
                      - ec2.amazonaws.com
                      - pods.eks.amazonaws.com
              # The role can never widen itself.
              - Sid: DenySelfEdit
                Effect: Deny
                Action: iam:*
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/agentic-platform-advisor-deploy
      Tags:
        - Key: project
          Value: agentic-platform-advisor

Outputs:
  WorkloadRepositoryUri:
    Description: Registry URI the benchmark stacks pull the workload image from.
    Value: !GetAtt WorkloadRepository.RepositoryUri

  DeployRoleArn:
    Description: Role ARN GitHub Actions assumes through OIDC. Store it as a repo variable, not in a file.
    Value: !GetAtt DeployRole.Arn
