AWSTemplateFormatVersion: "2010-09-09"
Description: Bootstrap stack, first half. Monthly budget alarm and the ECR repository for the workload image.

Parameters:
  BudgetEmail:
    Type: String
    Description: Address that receives the budget alerts. Pass it at deploy time; never commit it.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Must be an email address.

Resources:
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: agentic-platform-advisor-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 15
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
      ResourceTags:
        - Key: project
          Value: agentic-platform-advisor

  WorkloadRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: triage-workload
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: project
          Value: agentic-platform-advisor

Outputs:
  WorkloadRepositoryUri:
    Description: Registry URI the benchmark stacks pull the workload image from.
    Value: !GetAtt WorkloadRepository.RepositoryUri
