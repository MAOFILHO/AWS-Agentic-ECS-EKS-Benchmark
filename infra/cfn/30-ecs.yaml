AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Benchmark cell ecs-fargate or ecs-ec2 (ComputeType). ECS cluster, service in the private
  subnets, internet-facing ALB on HTTP port 80, and CPU target-tracking autoscaling.

# Fargate size: the default 256 CPU and 512 MB is the lowest-cost size (SPEC Decision 2).
# Card "real deploy" confirms the workload fits in it.

Parameters:
  RunId:
    Type: String
    Description: Benchmark run id, written to the run-id tag.
    AllowedPattern: "[a-z0-9-]+"
  TtlHours:
    Type: Number
    Default: 4
    MinValue: 1
    Description: Hours before the janitor deletes this stack.
  NetworkStackName:
    Type: String
    Description: Name of the 10-network stack whose exports this stack reads.
  ImageUri:
    Type: String
    Description: Workload image in ECR, with tag or digest.
  Cpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]
    Description: Fargate CPU units per task.
  Memory:
    Type: String
    Default: "512"
    AllowedPattern: "[0-9]+"
    Description: Fargate memory in MB per task. Must be a size Fargate allows for the CPU.
  MinReplicas:
    Type: Number
    Default: 1
    MinValue: 1
  MaxReplicas:
    Type: Number
    Default: 4
    MinValue: 1
  LlmMode:
    Type: String
    Default: mock
    AllowedValues: [mock, bedrock]
  ComputeType:
    Type: String
    Default: FARGATE
    AllowedValues: [FARGATE, EC2]
    Description: FARGATE for the ecs-fargate cell, EC2 for the ecs-ec2 cell.
  InstanceType:
    Type: String
    Default: t3.small
    Description: EC2 container instance type (ComputeType=EC2 only). x86_64, to match the amd64 image.

Conditions:
  IsEc2: !Equals [!Ref ComputeType, EC2]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !If [IsEc2, !Sub "/ecs/${RunId}-ecs-ec2", !Sub "/ecs/${RunId}-ecs-fargate"]
      RetentionInDays: 7
      Tags:
        - { Key: run-id, Value: !Ref RunId }
        - { Key: ttl-hours, Value: !Ref TtlHours }
        - { Key: project, Value: agentic-platform-advisor }
        - { Key: cell, Value: !If [IsEc2, ecs-ec2, ecs-fargate] }

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !If [IsEc2, !Sub "${RunId}-ecs-ec2", !Sub "${RunId}-ecs-fargate"]
      Tags:
        - { Key: run-id, Value: !Ref RunId }
        - { Key: ttl-hours, Value: !Ref TtlHours }
        - { Key: project, Value: agentic-platform-advisor }
        - { Key: cell, Value: !If [IsEc2, ecs-ec2, ecs-fargate] }

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from the internet to the load balancer
      VpcId: !ImportValue { "Fn::Sub": "${NetworkStackName}-VpcId" }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: run-id, Value: !Ref RunId }
        - { Key: ttl-hours, Value: !Ref TtlHours }
        - { Key: project, Value: agentic-platform-advisor }
        - { Key: cell, Value: !If [IsEc2, ecs-ec2, ecs-fargate] }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Workload port from the load balancer only
      VpcId: !ImportValue { "Fn::Sub": "${NetworkStackName}-VpcId" }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - { Key: run-id, Value: !Ref RunId }
        - { Key: ttl-hours, Value: !Ref TtlHours }
        - { Key: project, Value: agentic-platform-advisor }
        - { Key: cell, Value: !If [IsEc2, ecs-ec2, ecs-fargate] }

  # Pulls the image and writes logs. Needs no other permission.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !ImportValue agentic-platform-advisor-StackRoleBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pull-image-write-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn
      Tags:
        - { Key: run-id, Value: !Ref RunId }
        - { Key: ttl-hours, Value: !Ref TtlHours }
        - { Key: project, Value: agentic-platform-advisor }
        - { Key: cell, Value: !If [IsEc2, ecs-ec2, ecs-fargate] }

  # The workload's own identity. It may call one model and nothing else.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !ImportValue agentic-platform-advisor-StackRoleBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-nova-micro
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0"
      Tags:
        - { Key: run-id, Value: !Ref RunId }
        - { Key: ttl-hours, Value: !Ref TtlHours }
        - { Key: project, Value: agentic-platform-advisor }
        - { Key: cell, Value: !If [IsEc2, ecs-ec2, ecs-fargate] }

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !If [IsEc2, !Sub "${RunId}-ecs-ec2", !Sub "${RunId}-ecs-fargate"]
      RequiresCompatibilities: !If [IsEc2, [EC2], [FARGATE]]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: workload
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - { Name: LLM_MODE, Value: !Ref LlmMode }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: workload
      Tags:
        - { Key: run-id, Value: !Ref RunId }
        - { Key: ttl-hours, Value: !Ref TtlHours }
        - { Key: project, Value: agentic-platform-advisor }
        - { Key: cell, Value: !If [IsEc2, ecs-ec2, ecs-fargate] }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Split [",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PublicSubnetIds" }]
      SecurityGroups: [!Ref AlbSecurityGroup]
      Tags:
        - { Key: run-id, Value: !Ref RunId }
        - { Key: ttl-hours, Value: !Ref TtlHours }
        - { Key: project, Value: agentic-platform-advisor }
        - { Key: cell, Value: !If [IsEc2, ecs-ec2, ecs-fargate] }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue { "Fn::Sub": "${NetworkStackName}-VpcId" }
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /readyz
      Tags:
        - { Key: run-id, Value: !Ref RunId }
        - { Key: ttl-hours, Value: !Ref TtlHours }
        - { Key: project, Value: agentic-platform-advisor }
        - { Key: cell, Value: !If [IsEc2, ecs-ec2, ecs-fargate] }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    # Conditional DependsOn: with EC2, wait for the capacity provider to join the cluster.
    Metadata:
      WaitFor: !If [IsEc2, !Ref CapacityProviderAssociation, ""]
    Properties:
      ServiceName: !If [IsEc2, !Sub "${RunId}-ecs-ec2", !Sub "${RunId}-ecs-fargate"]
      Cluster: !Ref Cluster
      LaunchType: !If [IsEc2, !Ref AWS::NoValue, FARGATE]
      CapacityProviderStrategy: !If
        - IsEc2
        - [{ CapacityProvider: !Ref CapacityProvider, Weight: 1 }]
        - !Ref AWS::NoValue
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref MinReplicas
      HealthCheckGracePeriodSeconds: 30
      PropagateTags: SERVICE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: !Split [",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnetIds" }]
      LoadBalancers:
        - ContainerName: workload
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - { Key: run-id, Value: !Ref RunId }
        - { Key: ttl-hours, Value: !Ref TtlHours }
        - { Key: project, Value: agentic-platform-advisor }
        - { Key: cell, Value: !If [IsEc2, ecs-ec2, ecs-fargate] }

  # ComputeType=EC2 only, from here to CapacityProviderAssociation. Tasks keep awsvpc and the
  # task security group, so the instances need no inbound rule.
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsEc2
    Properties:
      GroupDescription: ECS container instances, no inbound traffic
      VpcId: !ImportValue { "Fn::Sub": "${NetworkStackName}-VpcId" }
      Tags:
        - { Key: run-id, Value: !Ref RunId }
        - { Key: ttl-hours, Value: !Ref TtlHours }
        - { Key: project, Value: agentic-platform-advisor }
        - { Key: cell, Value: ecs-ec2 }

  # The ECS agent on the instance registers it with the cluster and reports task state.
  InstanceRole:
    Type: AWS::IAM::Role
    Condition: IsEc2
    Properties:
      PermissionsBoundary: !ImportValue agentic-platform-advisor-StackRoleBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ecs-agent
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:DeregisterContainerInstance
                  - ecs:RegisterContainerInstance
                  - ecs:Submit*
                Resource: !GetAtt Cluster.Arn
              - Effect: Allow
                Action:
                  - ecs:DiscoverPollEndpoint
                  - ecs:Poll
                  - ecs:StartTelemetrySession
                  - ecs:UpdateContainerInstancesState
                Resource: "*"
      Tags:
        - { Key: run-id, Value: !Ref RunId }
        - { Key: ttl-hours, Value: !Ref TtlHours }
        - { Key: project, Value: agentic-platform-advisor }
        - { Key: cell, Value: ecs-ec2 }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: IsEc2
    Properties:
      Roles: [!Ref InstanceRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Condition: IsEc2
    Properties:
      LaunchTemplateData:
        # ECS-optimized Amazon Linux 2023, x86_64, latest recommended.
        ImageId: "{{resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id}}"
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds: [!Ref InstanceSecurityGroup]
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo "ECS_CLUSTER=${Cluster}" >> /etc/ecs/ecs.config
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: run-id, Value: !Ref RunId }
              - { Key: ttl-hours, Value: !Ref TtlHours }
              - { Key: project, Value: agentic-platform-advisor }
              - { Key: cell, Value: ecs-ec2 }
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - { Key: run-id, Value: !Ref RunId }
            - { Key: ttl-hours, Value: !Ref TtlHours }
            - { Key: project, Value: agentic-platform-advisor }
            - { Key: cell, Value: ecs-ec2 }

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Condition: IsEc2
    Properties:
      MinSize: !Ref MinReplicas
      MaxSize: !Ref MaxReplicas
      VPCZoneIdentifier: !Split [",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PrivateSubnetIds" }]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - { Key: run-id, Value: !Ref RunId, PropagateAtLaunch: true }
        - { Key: ttl-hours, Value: !Ref TtlHours, PropagateAtLaunch: true }
        - { Key: project, Value: agentic-platform-advisor, PropagateAtLaunch: true }
        - { Key: cell, Value: ecs-ec2, PropagateAtLaunch: true }

  # ECS grows and shrinks the Auto Scaling group to fit the tasks the service wants.
  CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Condition: IsEc2
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref AutoScalingGroup
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
        ManagedTerminationProtection: DISABLED
      Tags:
        - { Key: run-id, Value: !Ref RunId }
        - { Key: ttl-hours, Value: !Ref TtlHours }
        - { Key: project, Value: agentic-platform-advisor }
        - { Key: cell, Value: ecs-ec2 }

  CapacityProviderAssociation:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Condition: IsEc2
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders: [!Ref CapacityProvider]
      DefaultCapacityProviderStrategy:
        - { CapacityProvider: !Ref CapacityProvider, Weight: 1 }

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${Cluster}/${Service.Name}"
      MinCapacity: !Ref MinReplicas
      MaxCapacity: !Ref MaxReplicas

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${RunId}-cpu-60"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

Outputs:
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
