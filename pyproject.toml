[project]
name = "agentic-platform-advisor"
version = "0.0.0"
description = "ECS vs EKS agent benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
    "awscrt>=0.37.0",
    "boto3>=1.43.108",
    "fastapi>=0.142.2",
    "langgraph>=1.2.13",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
extend-exclude = [".claude"]
