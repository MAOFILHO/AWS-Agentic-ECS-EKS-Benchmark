AWSTemplateFormatVersion: "2010-09-09"
Description: Test fixture. ECR repository with mutable tags; cfn-guard must reject it.
Resources:
  Repo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: triage-workload
      ImageTagMutability: MUTABLE
      Tags:
        - Key: project
          Value: agentic-platform-advisor
