AWSTemplateFormatVersion: "2010-09-09"
Description: Test fixture. Task security group open to the internet on 8080; cfn-guard must reject it.
Resources:
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Workload port
      VpcId: vpc-00000000
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: project
          Value: agentic-platform-advisor
