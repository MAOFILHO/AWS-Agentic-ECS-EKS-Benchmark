AWSTemplateFormatVersion: "2010-09-09"
Description: Test fixture. Task security group reachable from the load balancer group only; cfn-guard must accept it.
Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from the internet
      VpcId: vpc-00000000
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: project
          Value: agentic-platform-advisor
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Workload port
      VpcId: vpc-00000000
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: project
          Value: agentic-platform-advisor
